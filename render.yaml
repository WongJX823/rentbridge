# Render Blueprint — documents the web service + required env vars so setup
# is repeatable. Import this in the Render dashboard ("New +" -> "Blueprint"),
# or just use it as a checklist while creating the service manually.
#
# NOTE (storage): this app writes uploaded property photos, signed contract
# PDFs, signatures, and documents to uploads/ at runtime. Render's default
# disk is EPHEMERAL — anything written there is lost on every redeploy and
# on every restart (including free-tier spin-down after inactivity). This
# blueprint does not attach a persistent disk. See docker/README.md.
services:
  - type: web
    name: rentbridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: RB_DB_HOST
        sync: false
      - key: RB_DB_PORT
        sync: false
      - key: RB_DB_NAME
        sync: false
      - key: RB_DB_USER
        sync: false
      - key: RB_DB_PASS
        sync: false
      - key: RB_DB_SSL_CA
        # Points at a Render "Secret File" (dashboard -> service -> Environment
        # -> Secret Files), not a file in the repo — see docker/README.md for
        # how to get Aiven's CA cert there without committing it to git.
        value: /etc/secrets/aiven-ca.pem
      - key: RB_BASE_PATH
        value: ""
      - key: RB_SMTP_HOST
        sync: false
      - key: RB_SMTP_PORT
        sync: false
      - key: RB_SMTP_USERNAME
        sync: false
      - key: RB_SMTP_PASSWORD
        sync: false
      - key: RB_SMTP_ENCRYPTION
        sync: false
      - key: RB_SMTP_FROM_EMAIL
        sync: false
      - key: RB_SMTP_FROM_NAME
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
