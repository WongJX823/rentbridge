# Render Blueprint — documents the web service + required env vars so setup
# is repeatable. Import this in the Render dashboard ("New +" -> "Blueprint"),
# or just use it as a checklist while creating the service manually.
#
# NOTE (storage): this app writes uploaded property photos, signed contract
# PDFs, signatures, and documents to uploads/ at runtime. Render's default
# disk is EPHEMERAL — anything written there is lost on every redeploy and
# on every restart (including free-tier spin-down after inactivity). This
# blueprint does not attach a persistent disk; instead uploads/ is backed by
# Cloudflare R2 (see the RB_R2_* vars below and includes/storage.php) — set
# those and uploads survive restarts. Leaving them unset makes the app fall
# back to the ephemeral local disk (fine for a quick test deploy, not for
# real use). See docker/README.md.
services:
  - type: web
    name: rentbridge
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: RB_DB_HOST
        sync: false
      - key: RB_DB_PORT
        sync: false
      - key: RB_DB_NAME
        sync: false
      - key: RB_DB_USER
        sync: false
      - key: RB_DB_PASS
        sync: false
      - key: RB_DB_SSL_CA_B64
        # Base64 of Aiven's CA cert (a public cert, not a secret in the usual
        # sense — safe to paste as a plain value). docker/entrypoint.sh
        # decodes this to /tmp/certs/aiven-ca.pem at container start and sets
        # RB_DB_SSL_CA to that path itself — do NOT also set RB_DB_SSL_CA
        # here. We deliberately do NOT use Render's "Secret Files" for this:
        # on the free tier, secret files are mounted with permissions that
        # even a root-uid process inside the container can't read (see
        # docker/README.md).
        sync: false
      - key: RB_BASE_PATH
        value: ""
      - key: RB_SMTP_HOST
        sync: false
      - key: RB_SMTP_PORT
        sync: false
      - key: RB_SMTP_USERNAME
        sync: false
      - key: RB_SMTP_PASSWORD
        sync: false
      - key: RB_SMTP_ENCRYPTION
        sync: false
      - key: RB_SMTP_FROM_EMAIL
        sync: false
      - key: RB_SMTP_FROM_NAME
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o
      - key: RB_R2_ACCOUNT_ID
        sync: false
      - key: RB_R2_ACCESS_KEY
        sync: false
      - key: RB_R2_SECRET_KEY
        sync: false
      - key: RB_R2_BUCKET
        sync: false
      - key: RB_R2_PUBLIC_URL
        # The bucket's public base URL (R2's own r2.dev subdomain, or a
        # custom domain attached to it). Not a secret — safe as a plain
        # value — but there's nothing to default it to until the bucket
        # exists, so it's left for the dashboard like the others above.
        sync: false
