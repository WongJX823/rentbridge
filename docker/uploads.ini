; Mirrors local dev limits (D:\Xampp\php\php.ini) — mPDF is memory-hungry,
; and property-photo / contract-document uploads need more than PHP's
; conservative defaults (2M upload / 8M post / 128M memory).
upload_max_filesize = 40M
post_max_size = 60M
memory_limit = 512M
max_execution_time = 120
display_errors = Off
